name: Publish demo UI

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish only the browser demo; the UI entry point lives in ui/.
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
