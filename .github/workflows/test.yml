name: Solidity tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ui/preflight-policy.test.cjs
