name: Solidity tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
      - run: forge coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ui/preflight-policy.test.cjs

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install slither-analyzer
      # Intentional exclusions: balance-delta checks compare pre/post external token balances;
      # events are emitted after the guarded external call; timestamp comparisons enforce expiries.
      - run: slither . --exclude-dependencies --filter-paths 'test|script' --exclude reentrancy-balance,reentrancy-events,timestamp
      - run: bash -n scripts/deploy-intent-executor-sepolia.sh
      - run: bash -n scripts/deploy-sepolia.sh
      - run: bash scripts/test_deploy_guards.sh
      - run: python -m py_compile scripts/agent_runner.py scripts/verify_agent_intent.py scripts/fee_policy.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
